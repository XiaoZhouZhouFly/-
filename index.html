<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="單字練習">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>英文單字練習</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f4f1ea; --card:#ffffff; --ink:#1f2a37; --muted:#56606c; --line:#d9d4c8;
  --accent:#2a5885; --accent-ink:#ffffff; --chip:#ebe7dc;
  --good:#256b43; --good-bg:#e3f2e8; --bad:#a93a28; --bad-bg:#fbe7e2;
  --warn:#7a5200; --warn-bg:#fdf0cf; --warn-line:#d9a93f;
  --shadow:0 1px 2px rgba(31,42,55,.06),0 8px 22px rgba(31,42,55,.08);
  --nav-h:58px; --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14181d; --card:#1e242b; --ink:#e8ecf0; --muted:#a7b1bd; --line:#33404c;
  --accent:#7fb0e0; --accent-ink:#0f1720; --chip:#28303a;
  --good:#7fd09b; --good-bg:#1b3326; --bad:#f4a090; --bad-bg:#3a1f1a;
  --warn:#f0c46a; --warn-bg:#3a2f12; --warn-line:#8a6a1f; --shadow:0 0 0 rgba(0,0,0,0);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
button,select,input,textarea{font-family:inherit;touch-action:manipulation}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(var(--sat) + 8px) calc(14px + env(safe-area-inset-right,0px)) calc(var(--nav-h) + var(--sab) + 16px) calc(14px + env(safe-area-inset-left,0px))}
/* top */
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:6px}
.top h1{font-size:18px;margin:0}
.exp{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.exp svg{width:18px;height:18px}
.exp .badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;
  background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);font-size:12px;line-height:18px;text-align:center;font-weight:600}
.status{font-size:13px;color:var(--bad);margin:0 0 8px}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--ink);padding:0 14px;min-height:44px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--chip);font-weight:700}
.seg .n{color:var(--muted);font-weight:400;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 6px 0 12px;border:1px solid var(--line);
  border-radius:999px;background:var(--card);color:var(--muted)}
.pill svg{width:16px;height:16px;flex:none}
.pill select{border:0;background:transparent;color:var(--ink);font-size:16px;min-height:42px;padding:0 4px}
/* progress */
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.pbar{height:4px;border-radius:2px;background:var(--chip);overflow:hidden;margin-bottom:12px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:2px}
/* layout */
#view{flex:1;display:flex;flex-direction:column}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:4px 0 12px}
.actions{position:sticky;bottom:calc(var(--nav-h) + var(--sab));background:var(--bg);padding:10px 0 12px;display:flex;gap:10px;z-index:5}
.btn{flex:1;min-height:52px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.good{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:600}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:600}
.btn.small{flex:none;min-height:44px;padding:0 16px;font-size:14px}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px;vertical-align:-3px;margin-right:4px}
/* cards */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px 16px}
.fc{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  cursor:pointer;user-select:none;-webkit-user-select:none;gap:6px}
.fc .word{font-size:38px;font-weight:700;word-break:break-word;line-height:1.15}
.fc .pos{color:var(--muted);font-size:16px}
.fc .zh{font-size:24px;margin-top:8px;line-height:1.5}
.fc .hint{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-top:14px}
.fc .hint svg{width:16px;height:16px}
.src{position:absolute;top:14px;left:16px;font-size:13px;color:var(--muted)}
.spk{position:absolute;top:6px;right:6px;width:44px;height:44px;border:0;background:transparent;color:var(--muted);border-radius:12px;display:flex;align-items:center;justify-content:center}
.spk svg{width:22px;height:22px}
.spk:active{background:var(--chip)}
.q{padding-top:34px}
.q .word{font-size:32px;font-weight:700;text-align:center;word-break:break-word;line-height:1.15}
.q .pos{text-align:center;color:var(--muted);font-size:16px;margin:2px 0 14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;min-height:56px;padding:12px 14px;margin-top:8px;
  border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;line-height:1.4}
.opt svg{width:22px;height:22px;flex:none}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{opacity:1}
.result{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;font-size:16px;font-weight:600;min-height:24px}
.result svg{width:20px;height:20px}
.result.ok{color:var(--good)} .result.no{color:var(--bad)}
.meaning{font-size:24px;text-align:center;margin:6px 0 10px;line-height:1.5}
.boxes{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:4px 0 16px;min-height:34px;align-items:flex-end}
.boxes span{display:inline-block;min-width:20px;text-align:center;font-size:22px;line-height:28px;border-bottom:2px solid var(--muted);color:var(--ink)}
.boxes span.gap{border-bottom:0;min-width:12px}
.boxes span.fix{border-bottom-color:var(--accent);font-weight:700}
input[type=text],textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;min-height:52px}
textarea{min-height:180px;font-size:16px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{color:var(--muted);text-align:center;padding:28px 10px;line-height:1.8;font-size:16px}
/* list */
.search{margin-bottom:10px}
.list .item{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);min-height:64px}
.list .item:last-child{border-bottom:0}
.list .main{flex:1;min-width:0}
.list .w{font-weight:700;font-size:17px}
.list .p{color:var(--muted);font-size:14px;margin-left:6px}
.list .z{font-size:15px;margin-top:2px;line-height:1.45}
.chips{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.mini{min-height:40px;min-width:76px;padding:0 12px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;font-size:14px;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--bad-bg);color:var(--bad);border-color:var(--bad);font-weight:600}
.tag{display:inline-block;font-size:12px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:1px 7px;margin-left:6px}
.listcount{font-size:13px;color:var(--muted);margin:0 2px 6px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + var(--sab) + 16px);width:56px;height:56px;border-radius:28px;border:0;
  background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;z-index:20}
.fab svg{width:26px;height:26px}
.fab.show{display:flex}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:var(--sab);display:flex;justify-content:center}
.nav .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
.nav button{border:0;background:transparent;color:var(--muted);min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px}
.nav button svg{width:24px;height:24px}
.nav button[aria-selected=true]{color:var(--accent);font-weight:700}
body.kb .nav,body.kb .fab{display:none}
body.kb #app{padding-bottom:16px}
body.kb .actions{bottom:0}
/* sheet */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  padding-top:var(--sat)}
.sheet[hidden]{display:none}
.sheet header{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 8px 0 16px;border-bottom:1px solid var(--line);background:var(--card)}
.sheet header h2{font-size:17px;margin:0}
.sheet header button{border:0;background:transparent;color:var(--accent);font-size:16px;font-weight:600;min-height:44px;min-width:56px}
.sheet .body{flex:1;overflow:auto;padding:14px calc(14px + env(safe-area-inset-right,0px)) 24px calc(14px + env(safe-area-inset-left,0px));max-width:560px;width:100%;margin:0 auto}
.sheet .foot{padding:10px 14px calc(10px + var(--sab));border-top:1px solid var(--line);background:var(--card);display:flex;gap:10px;justify-content:center}
.sheet .foot .btn{max-width:532px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 96px;gap:10px}
.sheet .seg{display:flex;margin-bottom:16px}
.sheet .seg button{flex:1}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.sec h3{margin:0 0 8px;font-size:15px}
.kv{font-size:15px;line-height:1.9}
.steps{margin:0;padding-left:22px;font-size:15px;line-height:1.9}
.steps li{margin-bottom:6px}
.file{display:flex;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.file:first-of-type{border-top:0;padding-top:0}
.file .name{flex:1;min-width:0}
.file .name b{display:block;font-size:16px}
.file .name span{font-size:13px;color:var(--muted)}
.file .name .chg{color:var(--warn);font-weight:600}
.copybox{margin-top:12px;font-size:13px;min-height:160px;font-family:ui-monospace,Menlo,monospace;display:none}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--sab) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:16px;font-size:15px;line-height:1.5;opacity:0;pointer-events:none;transition:opacity .2s;width:max-content;max-width:86vw;text-align:center;z-index:80}
.toast.show{opacity:1}
@media (max-width:380px){.pill svg{display:none}.pill{padding-left:10px}.seg button{padding:0 11px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <h1>英文單字練習</h1>
    <button class="exp" id="exportBtn" aria-label="匯出到 GitHub"></button>
  </div>
  <p class="status" id="status" hidden></p>
  <div id="filters"></div>
  <main id="view"></main>
</div>
<nav class="nav"><div class="in" id="nav" role="tablist"></div></nav>
<button class="fab" id="fab" aria-label="新增單字"></button>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- icons ---------- */
const svg = (d, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${d}</svg>`;
const ICON = {
  speaker: svg('<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'),
  cards:   svg('<rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>'),
  choice:  svg('<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>'),
  pencil:  svg('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/>'),
  list:    svg('<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>'),
  plus:    svg('<path d="M12 5v14M5 12h14"/>'),
  upload:  svg('<path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/>'),
  flip:    svg('<path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/>'),
  ok:      svg('<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>'),
  no:      svg('<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>'),
  sort:    svg('<path d="M7 4v16"/><path d="m3 8 4-4 4 4"/><path d="M17 20V4"/><path d="m13 16 4 4 4-4"/>'),
};

/* ---------- data & state ----------
   words.json / progress.json 在 repo 裡是正式資料。
   這台裝置上新增的單字與進度先存在 localStorage，匯出並上傳後才成為正式資料。 */
const LS_KEY = 'vocab-local-v2';
let base = [], baseProg = {}, added = [], lprog = {};
let loadInfo = {words:false, prog:false};
let loading = true;
let tab = 'card';
let scope = 'all';

const key = w => w.trim().toLowerCase();
const allWords = () => base.concat(added);
const getP = k => lprog[k] || baseProg[k];
const isWeak = w => { const p = getP(key(w.w)); return !!(p && p.weak); };
const mergedProg = () => Object.assign({}, baseProg, lprog);
const pool = () => allWords().filter(w => scope === 'all' || isWeak(w));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify({added, prog:lprog})); } catch(e){} }
function loadLocal(){
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (s) { if (Array.isArray(s.added)) added = s.added.filter(w => w && w.w && w.zh); if (s.prog && typeof s.prog === 'object') lprog = s.prog; }
  } catch(e){}
}
function prune(){
  const have = new Set(base.map(w => key(w.w)));
  added = added.filter(w => !have.has(key(w.w)));
  Object.keys(lprog).forEach(k => { if (baseProg[k] && (baseProg[k].t||0) >= (lprog[k].t||0)) delete lprog[k]; });
  saveLocal();
}
async function fetchJson(name){
  const r = await fetch(name + '?v=' + Date.now(), {cache:'no-store'});
  if (!r.ok) throw new Error(name + ' ' + r.status);
  return r.json();
}
const FIELDS = ['bad','ok','streak','weak','t'];
const nowMin = () => Math.floor(Date.now() / 60000);
const blank = () => ({weak:false, streak:0, bad:0, ok:0, t:0});
function decodeProg(j){
  const f = Array.isArray(j.fields) ? j.fields : FIELDS, out = {};
  Object.entries(j.words || {}).forEach(([k, v]) => {
    if (!Array.isArray(v)) return;
    const o = blank(); f.forEach((name, i) => { o[name] = v[i]; });
    o.weak = !!o.weak; out[k] = o;
  });
  return out;
}
function setStatus(t){ const s = $('status'); s.hidden = !t; s.textContent = t || ''; }
async function init(){
  loadLocal(); render();
  loadInfo = {words:false, prog:false};
  try { const j = await fetchJson('words.json'); base = (j.words||[]).filter(w => w && w.w && w.zh); loadInfo.words = true; setStatus(''); }
  catch(e){ setStatus('讀不到 words.json，目前只顯示這台裝置上新增的單字。若是直接開啟檔案，請改用網頁網址。'); }
  try { baseProg = decodeProg(await fetchJson('progress.json')); loadInfo.prog = true; } catch(e){}
  loading = false; prune();
  fc.queue = []; mq.queue = []; sp.queue = [];
  render();
}

/* ---------- progress ---------- */
function mark(word, correct, selfClear){
  const k = key(word.w); const p = Object.assign(blank(), getP(k));
  if (correct) { p.ok++; p.streak++; if (selfClear || p.streak >= 2) p.weak = false; }
  else { p.streak = 0; p.bad++; p.weak = true; }
  p.t = nowMin(); lprog[k] = p; saveLocal(); renderStats();
}
function setWeak(word, v){
  const k = key(word.w); const cur = getP(k);
  if (cur ? cur.weak === v : !v) return;
  const p = Object.assign(blank(), cur);
  p.weak = v; p.streak = 0; p.t = nowMin(); lprog[k] = p; saveLocal(); renderStats();
}
function pending(){ return {w: added.length, p: Object.keys(lprog).length}; }
function renderStats(){
  const all = allWords(); const weak = all.filter(isWeak).length;
  const a = $('cntAll'), b = $('cntWeak'); if (a) a.textContent = all.length; if (b) b.textContent = weak;
  const {w, p} = pending(); const n = w + p;
  $('exportBtn').innerHTML = ICON.upload + '匯出' + (n ? `<span class="badge" aria-label="${n} 項未上傳">${n>99?'99+':n}</span>` : '');
}

/* ---------- 出題順序（加權隨機）---------- */
const ORDERS = [
  ['random','隨機'], ['weak','不熟優先'], ['bad','答錯最多優先'], ['acc','正確率最低優先'],
  ['unseen','沒練過優先'], ['stale','最久沒練優先'], ['orig','原本順序'],
];
let orderMode = 'random';
try { const o = localStorage.getItem('vocab-order'); if (ORDERS.some(x => x[0] === o)) orderMode = o; } catch(e){}
function weightOf(w){
  const p = getP(key(w.w)); const seen = p ? (p.ok||0) + (p.bad||0) : 0;
  switch (orderMode) {
    case 'weak':   return p && p.weak ? 6 : 1;
    case 'bad':    return 1 + 3 * (p ? p.bad||0 : 0);
    case 'acc':    return seen ? 0.3 + 6 * (1 - (p.ok||0) / seen) : 0.1;
    case 'unseen': return seen ? 1 : 10;
    case 'stale': { if (!p || !p.t) return 10; const days = Math.max(0, (nowMin() - p.t) / 1440); return 1 + Math.min(days, 30); }
    default:       return 1;
  }
}
function ordered(list){
  if (orderMode === 'orig') return list.slice();
  return list.map(w => ({w, k: -Math.log(1 - Math.random()) / weightOf(w)})).sort((a,b) => a.k - b.k).map(x => x.w);
}

/* ---------- speech ---------- */
const canSpeak = 'speechSynthesis' in window;
function speak(t){
  if (!canSpeak) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .9; speechSynthesis.speak(u); } catch(e){}
}
const spkBtn = w => canSpeak ? `<button class="spk" data-say="${esc(w)}" aria-label="發音">${ICON.speaker}</button>` : '';
function bindSay(){ document.querySelectorAll('[data-say]').forEach(b => b.onclick = e => { e.stopPropagation(); speak(b.dataset.say); }); }

/* ---------- shared chrome ---------- */
function renderFilters(){
  const el = $('filters');
  if (tab === 'list') { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="filters">
    <div class="seg" id="scope">
      <button data-s="all" aria-pressed="${scope==='all'}">全部<span class="n" id="cntAll"></span></button>
      <button data-s="weak" aria-pressed="${scope==='weak'}">不熟<span class="n" id="cntWeak"></span></button>
    </div>
    <label class="pill">${ICON.sort}<select id="ordSel" aria-label="出題順序">${ORDERS.map(o => `<option value="${o[0]}" ${o[0]===orderMode?'selected':''}>${o[1]}</option>`).join('')}</select></label>
  </div>`;
  document.querySelectorAll('#scope button').forEach(b => b.onclick = () => { scope = b.dataset.s; restart(); });
  $('ordSel').onchange = e => { orderMode = e.target.value; try { localStorage.setItem('vocab-order', orderMode); } catch(err){} restart(); };
  renderStats();
}
function restart(){ fc.queue = []; mq.queue = []; sp.queue = []; fc.i = mq.i = sp.i = 0; render(); }
function emptyPool(){
  if (loading && !allWords().length) return `<div class="stage"><div class="card empty">載入中…</div></div>`;
  return `<div class="stage"><div class="card empty">${scope==='weak' ? '目前沒有標記不熟的單字，太棒了！<br>切換到「全部」繼續練習。' : '還沒有單字，到「單字表」新增吧。'}</div></div>`;
}
function progressHead(i, total, right){
  const pct = Math.round(i / total * 100);
  return `<div class="meta"><span>${Math.min(i+1,total)} / ${total}</span><span>${right||''}</span></div><div class="pbar"><i style="width:${pct}%"></i></div>`;
}
function doneView(msg, again){
  return `<div class="stage"><div class="card empty" style="font-size:18px">這一輪完成了 🎉<br>${msg}</div></div>
    <div class="actions"><button class="btn primary" id="again">再來一輪</button></div>`;
}

/* ---------- flashcards ---------- */
let fc = {queue:[], i:0, flipped:false};
function fcStart(){ fc = {queue: ordered(pool()), i:0, flipped:false}; }
function renderCard(){
  const v = $('view');
  if (!fc.queue.length) fcStart();
  if (!fc.queue.length){ v.innerHTML = emptyPool(); return; }
  if (fc.i >= fc.queue.length){
    v.innerHTML = doneView(`共 ${fc.queue.length} 個字`);
    $('again').onclick = () => { fcStart(); renderCard(); }; return;
  }
  const w = fc.queue[fc.i];
  v.innerHTML = progressHead(fc.i, fc.queue.length) + `
  <div class="stage">
    <div class="card fc" id="fc">
      <span class="src">${esc(w.src||'')}</span>${spkBtn(w.w)}
      <div class="word">${esc(w.w)}</div>
      <div class="pos">${esc(w.pos||'')}</div>
      ${fc.flipped ? `<div class="zh">${esc(w.zh)}</div>` : `<div class="hint">${ICON.flip}點卡片看意思</div>`}
    </div>
  </div>
  <div class="actions">${fc.flipped
    ? `<button class="btn bad" id="no">不熟</button><button class="btn good" id="yes">會了</button>`
    : `<button class="btn primary" id="flip">${ICON.flip}看意思</button>`}</div>`;
  bindSay();
  const flip = () => { fc.flipped = true; renderCard(); };
  $('fc').onclick = () => { fc.flipped = !fc.flipped; renderCard(); };
  if (!fc.flipped) $('flip').onclick = flip;
  else {
    $('no').onclick = () => { mark(w, false); fc.i++; fc.flipped=false; renderCard(); };
    $('yes').onclick = () => { mark(w, true, true); fc.i++; fc.flipped=false; renderCard(); };
  }
}

/* ---------- multiple choice ---------- */
let mq = {queue:[], i:0, score:0, answered:false, opts:[], picked:-1};
function mqStart(){ mq = {queue: ordered(pool()), i:0, score:0, answered:false, opts:[], picked:-1}; }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function mqOptions(w){
  const others = shuffle(allWords().filter(x => key(x.w) !== key(w.w) && x.zh !== w.zh));
  const picks = others.filter(x => x.pos === w.pos).slice(0,3);
  for (const x of others) { if (picks.length >= 3) break; if (!picks.includes(x)) picks.push(x); }
  return shuffle([w].concat(picks)).map(x => ({zh:x.zh, ok: x === w}));
}
function renderMcq(){
  const v = $('view');
  if (!mq.queue.length) mqStart();
  if (allWords().length < 4){ v.innerHTML = `<div class="stage"><div class="card empty">至少要有 4 個單字才能出選擇題。</div></div>`; return; }
  if (!mq.queue.length){ v.innerHTML = emptyPool(); return; }
  if (mq.i >= mq.queue.length){
    v.innerHTML = doneView(`答對 ${mq.score} / ${mq.queue.length}`);
    $('again').onclick = () => { mqStart(); renderMcq(); }; return;
  }
  const w = mq.queue[mq.i];
  if (!mq.opts.length) mq.opts = mqOptions(w);
  const got = mq.answered && mq.opts[mq.picked] && mq.opts[mq.picked].ok;
  v.innerHTML = progressHead(mq.i, mq.queue.length, `答對 ${mq.score}`) + `
  <div class="stage"><div class="card q">
    ${spkBtn(w.w)}
    <div class="word">${esc(w.w)}</div>
    <div class="pos">${esc(w.pos||'')}</div>
    ${mq.opts.map((o,idx)=>{
      let c='opt', icon='';
      if (mq.answered){ if (o.ok) { c+=' right'; icon=ICON.ok; } else if (idx===mq.picked) { c+=' wrong'; icon=ICON.no; } }
      return `<button class="${c}" data-i="${idx}" ${mq.answered?'disabled':''}><span>${esc(o.zh)}</span>${icon}</button>`;}).join('')}
    <div class="result ${got?'ok':'no'}">${mq.answered ? (got ? ICON.ok+'答對了' : ICON.no+'答錯了，綠色是正確答案') : ''}</div>
  </div></div>
  <div class="actions">${mq.answered ? `<button class="btn primary" id="next">下一題</button>` : `<button class="btn" disabled>請選一個答案</button>`}</div>`;
  bindSay();
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (mq.answered) return;
    const idx = +b.dataset.i; mq.picked = idx; mq.answered = true;
    const ok = mq.opts[idx].ok; if (ok) mq.score++;
    mark(w, ok); renderMcq();
  });
  const n = $('next');
  if (n) n.onclick = () => { mq.i++; mq.answered=false; mq.opts=[]; mq.picked=-1; renderMcq(); window.scrollTo(0,0); };
}

/* ---------- spelling ---------- */
let sp = {queue:[], i:0, score:0, state:'ask'};
function spStart(){ sp = {queue: ordered(pool()), i:0, score:0, state:'ask'}; }
const norm = s => s.trim().toLowerCase().replace(/\s+/g,' ');
function hintBoxes(word){
  return [...word].map((ch,i) => {
    if (ch === ' ') return '<span class="gap"></span>';
    if (/[A-Za-z]/.test(ch)) return i === 0 ? `<span class="fix">${esc(ch)}</span>` : '<span>&nbsp;</span>';
    return `<span class="fix" style="border-bottom:0;min-width:10px">${esc(ch)}</span>`;
  }).join('');
}
function renderSpell(){
  const v = $('view');
  if (!sp.queue.length) spStart();
  if (!sp.queue.length){ v.innerHTML = emptyPool(); return; }
  if (sp.i >= sp.queue.length){
    v.innerHTML = doneView(`拼對 ${sp.score} / ${sp.queue.length}`);
    $('again').onclick = () => { spStart(); renderSpell(); }; return;
  }
  const w = sp.queue[sp.i];
  v.innerHTML = progressHead(sp.i, sp.queue.length, `拼對 ${sp.score}`) + `
  <div class="stage"><div class="card q">
    <div class="pos" style="margin-bottom:6px">${esc(w.pos||'')}</div>
    <div class="meaning">${esc(w.zh)}</div>
    <div class="boxes" aria-label="${w.w.length} 個字母">${hintBoxes(w.w)}</div>
    <input type="text" id="ans" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="輸入英文單字" ${sp.state!=='ask'?'disabled':''}>
    <div class="result" id="fb"></div>
  </div></div>
  <div class="actions" id="btns"></div>`;
  const inp = $('ans'), fb = $('fb'), btns = $('btns');
  function showAsk(){
    btns.innerHTML = `<button class="btn" id="giveup">顯示答案</button><button class="btn primary" id="check">檢查</button>`;
    $('check').onclick = check; $('giveup').onclick = () => reveal(false);
  }
  function reveal(ok){
    sp.state = 'done'; inp.disabled = true;
    fb.className = 'result ' + (ok?'ok':'no');
    fb.innerHTML = ok ? ICON.ok + '答對了：' + esc(w.w) : ICON.no + '答案：' + esc(w.w);
    btns.innerHTML = `${canSpeak?`<button class="btn" id="say">${ICON.speaker}發音</button>`:''}<button class="btn primary" id="next">下一題</button>`;
    const s = $('say'); if (s) s.onclick = () => speak(w.w);
    $('next').onclick = () => { sp.i++; sp.state='ask'; renderSpell(); window.scrollTo(0,0); };
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
  }
  function check(){
    if (!inp.value.trim()) return;
    const ok = norm(inp.value) === norm(w.w);
    if (ok) sp.score++; mark(w, ok); reveal(ok);
  }
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  if (sp.state === 'ask') showAsk();
}

/* ---------- list ---------- */
let listQuery = '';
function renderList(){
  const v = $('view');
  const q = listQuery.trim().toLowerCase();
  const all = allWords().filter(w => !q || w.w.toLowerCase().includes(q) || w.zh.includes(q));
  const customKeys = new Set(added.map(w => key(w.w)));
  v.innerHTML = `
  <input type="text" class="search" id="search" placeholder="搜尋單字或中文" value="${esc(listQuery)}" enterkeyhint="search" style="font-size:16px">
  <div class="listcount">${all.length} 個${q?'（符合搜尋）':''}</div>
  <div class="card list" style="padding:2px 16px;box-shadow:none">
    ${all.length ? all.map(w => `
    <div class="item">
      <div class="main">
        <div><span class="w">${esc(w.w)}</span><span class="p">${esc(w.pos||'')}</span>${customKeys.has(key(w.w))?'<span class="tag">待上傳</span>':''}</div>
        <div class="z">${esc(w.zh)}</div>
      </div>
      <div class="chips">
        <button class="mini" data-weak="${esc(key(w.w))}" aria-pressed="${isWeak(w)}">${isWeak(w)?'不熟':'標為不熟'}</button>
        ${customKeys.has(key(w.w))?`<button class="mini" data-del="${esc(key(w.w))}">刪除</button>`:''}
      </div>
    </div>`).join('') : '<div class="empty">找不到符合的單字</div>'}
  </div>
  <div style="height:72px"></div>`;
  const s = $('search');
  s.oninput = () => { listQuery = s.value; const pos = s.selectionStart; renderList(); const n = $('search'); n.focus(); n.setSelectionRange(pos,pos); };
  v.querySelectorAll('[data-weak]').forEach(b => b.onclick = () => {
    const w = allWords().find(x => key(x.w) === b.dataset.weak); if (w) { setWeak(w, !isWeak(w)); const y = window.scrollY; renderList(); window.scrollTo(0,y); }
  });
  v.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = '確定刪除？'; setTimeout(()=>{ if (b.isConnected){ b.dataset.armed=''; b.textContent='刪除'; } }, 2500); return; }
    added = added.filter(x => key(x.w) !== b.dataset.del); saveLocal(); restart();
  });
}

/* ---------- add words ---------- */
function parseLines(text){
  const out = [], bad = [];
  text.split(/\r?\n/).forEach(raw => {
    let s = raw.trim(); if (!s) return;
    s = s.replace(/^[*\-•]\s*/, '').replace(/^\d+[.)]\s*/, '');
    s = s.replace(/^(Passage\s+I+|Part\s+IV)?\s*(文中|第\d+點)\s*[：:]\s*/, '');
    let m = s.match(/^([A-Za-z][A-Za-z\-' ]*?)\s*[(（]([^)）]*)[)）]\s*(.+)$/);
    if (!m) { const p = s.split(/\s*[|｜\t]\s*/); if (p.length >= 3) m = [s, p[0], p[1], p.slice(2).join(' ')]; }
    if (!m) { const q = s.match(/^([A-Za-z][A-Za-z\-' ]*?)\s*[:：,，]\s*(.+)$/); if (q) m = [s, q[1], '', q[2]]; }
    if (!m || !m[1].trim() || !m[3].trim()) { bad.push(raw.trim()); return; }
    out.push({w: m[1].trim(), pos: m[2].trim(), zh: m[3].trim(), src: '自己新增'});
  });
  return {out, bad};
}
function addWords(list){
  const have = new Set(allWords().map(w => key(w.w)));
  let n = 0, dup = 0;
  list.forEach(w => { if (have.has(key(w.w))) { dup++; return; } have.add(key(w.w)); added.push(w); n++; });
  if (n) { saveLocal(); listChanged = true; }
  return {added:n, dup};
}

/* ---------- sheets ---------- */
function openSheet({title, left, body, foot, bind}){
  const sh = $('sheet');
  sh.hidden = false; document.body.style.overflow = 'hidden';
  sh.innerHTML = `<header><h2>${title}</h2><button id="sheetClose">${left||'完成'}</button></header>
    <div class="body" id="sheetBody">${body}</div>${foot?`<div class="foot">${foot}</div>`:''}`;
  $('sheetClose').onclick = closeSheet;
  bind && bind();
}
let listChanged = false;
function closeSheet(){ const sh = $('sheet'); sh.hidden = true; sh.innerHTML = ''; document.body.style.overflow = ''; document.body.classList.remove('kb'); if (listChanged) { listChanged = false; restart(); } else render(); }

let addMode = 'one';
function openAdd(){
  const draw = () => {
    openSheet({
      title: '新增單字', left: '完成',
      body: `<div class="seg"><button data-m="one" aria-pressed="${addMode==='one'}">單個新增</button><button data-m="bulk" aria-pressed="${addMode==='bulk'}">一次貼上多個</button></div>
        ${addMode==='one' ? `
          <div class="row2">
            <div class="field"><label for="nw">單字</label><input type="text" id="nw" autocapitalize="none" autocomplete="off" spellcheck="false" enterkeyhint="next"></div>
            <div class="field"><label for="np">詞性</label><input type="text" id="np" placeholder="n. / v." autocapitalize="none" enterkeyhint="next"></div>
          </div>
          <div class="field"><label for="nz">中文意思</label><input type="text" id="nz" enterkeyhint="done"></div>`
        : `<div class="field"><label for="bulk">每行一個，可直接貼 AI 整理的格式，例如「ebb (v.) 退潮、衰退」</label><textarea id="bulk" spellcheck="false"></textarea></div>`}`,
      foot: `<button class="btn primary" id="addGo">${addMode==='one'?'加入':'全部加入'}</button>`,
      bind: () => {
        document.querySelectorAll('#sheetBody .seg button').forEach(b => b.onclick = () => { addMode = b.dataset.m; draw(); });
        if (addMode === 'one') {
          const go = () => {
            const w = $('nw').value.trim(), p = $('np').value.trim(), z = $('nz').value.trim();
            if (!w || !z) { toast('單字和中文意思都要填'); return; }
            const r = addWords([{w, pos:p, zh:z, src:'自己新增'}]);
            toast(r.added ? '已加入' : '這個單字已經有了');
            if (r.added) { $('nw').value = ''; $('np').value = ''; $('nz').value = ''; $('nw').focus(); renderStats(); }
          };
          $('addGo').onclick = go; $('nz').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
        } else {
          $('addGo').onclick = () => {
            const {out, bad} = parseLines($('bulk').value);
            if (!out.length) { toast(bad.length ? '格式看不懂，請檢查' : '請先貼上單字'); return; }
            const r = addWords(out);
            toast(`加入 ${r.added} 個` + (r.dup?`，重複 ${r.dup} 個略過`:'') + (bad.length?`，${bad.length} 行看不懂`:''));
            closeSheet();
          };
        }
      }
    });
  };
  draw();
}

/* ---------- export ---------- */
function fmtWords(){
  const rows = allWords().map(w => '    ' + JSON.stringify({w:w.w, pos:w.pos||'', zh:w.zh, src:w.src||''}));
  return '{\n  "version": 1,\n  "words": [\n' + rows.join(',\n') + '\n  ]\n}\n';
}
function fmtProg(){
  const m = mergedProg(); const keys = Object.keys(m).sort();
  const rows = keys.map(k => { const p = m[k];
    return '    ' + JSON.stringify(k) + ': [' + [p.bad||0, p.ok||0, p.streak||0, p.weak?1:0, p.t||0].join(',') + ']'; });
  return '{\n  "version": 2,\n  "fields": ' + JSON.stringify(FIELDS) +
    ',\n  "note": "words 內每個字是一個陣列，依 fields 順序：bad=累計答錯, ok=累計答對, streak=目前連對, weak=1是不熟, t=最後更新時間(Unix分鐘)",' +
    '\n  "updated": ' + JSON.stringify(new Date().toISOString()) + ',\n  "words": {\n' + rows.join(',\n') + '\n  }\n}\n';
}
async function downloadFile(name, text){
  try {
    if (typeof claude !== 'undefined' && claude.use) {
      const d = await claude.use('downloads');
      if (d) { await d.save({filename:name, data:text}); toast('已儲存 ' + name); return; }
    }
  } catch(e){ if (e && e.code === 'declined') return; }
  try {
    const url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000); toast('已下載 ' + name);
  } catch(e){ showBox(text); }
}
function showBox(text){ const box = $('copybox'); if (!box) return; box.value = text; box.style.display = 'block'; box.focus(); box.select(); }
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast('已複製'); }
  catch(e){ showBox(text); toast('請長按全選後複製'); }
}
function openExport(){
  const {w:nW, p:nP} = pending();
  openSheet({
    title: '匯出到 GitHub', left: '完成',
    body: `
    <div class="sec"><h3>目前狀態</h3><div class="kv">
      網頁上的單字檔：${loadInfo.words ? base.length + ' 字' : '<span style="color:var(--bad)">讀取失敗</span>'}<br>
      網頁上的進度檔：${loadInfo.prog ? Object.keys(baseProg).length + ' 筆' : '尚無'}<br>
      ${nW||nP ? `這台裝置尚未上傳：新增單字 ${nW} 個、進度 ${nP} 筆` : '這台裝置沒有需要上傳的變更'}
    </div></div>
    <div class="sec"><h3>上傳步驟</h3><ol class="steps">
      <li>下載有變更的檔案</li><li>到 GitHub repo 上傳，覆蓋同名的舊檔</li><li>其他裝置重新整理網頁就會讀到最新內容</li></ol></div>
    <div class="sec">
      <div class="file"><div class="name"><b>words.json</b><span>${nW?'<span class="chg">有變更</span>　':''}共 ${allWords().length} 字</span></div>
        <button class="btn small" id="cw">複製</button><button class="btn primary small" id="dw">下載</button></div>
      <div class="file"><div class="name"><b>progress.json</b><span>${nP?'<span class="chg">有變更</span>　':''}共 ${Object.keys(mergedProg()).length} 筆</span></div>
        <button class="btn small" id="cp">複製</button><button class="btn primary small" id="dp">下載</button></div>
      <textarea class="copybox" id="copybox" readonly></textarea>
    </div>
    <button class="btn" id="reload" style="width:100%">重新載入最新資料</button>`,
    bind: () => {
      $('dw').onclick = () => downloadFile('words.json', fmtWords());
      $('dp').onclick = () => downloadFile('progress.json', fmtProg());
      $('cw').onclick = () => copyText(fmtWords());
      $('cp').onclick = () => copyText(fmtProg());
      $('reload').onclick = () => { closeSheet(); toast('重新讀取中…'); init(); };
    }
  });
}

/* ---------- router ---------- */
const TABS = [['card','單字卡','cards'],['mcq','選擇題','choice'],['spell','拼字','pencil'],['list','單字表','list']];
function renderNav(){
  $('nav').innerHTML = TABS.map(t => `<button role="tab" data-t="${t[0]}" aria-selected="${t[0]===tab}">${ICON[t[2]]}<span>${t[1]}</span></button>`).join('');
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); window.scrollTo(0,0); });
}
function render(){
  renderNav(); renderFilters(); renderStats();
  $('fab').classList.toggle('show', tab === 'list');
  if (tab === 'card') renderCard(); else if (tab === 'mcq') renderMcq(); else if (tab === 'spell') renderSpell(); else renderList();
}
$('fab').innerHTML = ICON.plus;
$('fab').onclick = openAdd;
$('exportBtn').onclick = openExport;
// 鍵盤出現時隱藏底部導覽，避免它浮在鍵盤上方佔空間
document.addEventListener('focusin', e => { if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) document.body.classList.add('kb'); });
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (!a || !/^(INPUT|TEXTAREA)$/.test(a.tagName)) document.body.classList.remove('kb'); }, 50));
init();
// PWA：註冊離線快取（在 artifact 預覽等不支援的環境會自動略過）
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
